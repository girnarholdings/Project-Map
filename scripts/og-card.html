<!doctype html>
<meta charset="utf-8" />
<!--
  Source for assets/og-image.png, the 1200x630 link-preview card.

  Render it at exactly 1200x630, deviceScaleFactor 1, from THIS directory so the
  ../assets/ paths resolve:

    node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();
      const p=await b.newPage({viewport:{width:1200,height:630}});
      await p.goto('file://'+process.cwd()+'/og-card.html',{waitUntil:'load'});
      await p.waitForTimeout(1200);
      await p.screenshot({path:'../assets/og-image.png'});await b.close();})()"

  It is kept out of the published site on purpose: Pages serves everything in the
  repo root, and scripts/ is build tooling, not a page. It carries the page's
  pitch, so when the pitch changes, change it here too — the share card is the
  first thing a stranger sees when the link is pasted.
-->
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../assets/fonts/instrument-serif.woff2") format("woff2"); font-style: normal; }
  @font-face { font-family: "Instrument Serif"; src: url("../assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
  @font-face { font-family: "Geist"; src: url("../assets/fonts/geist.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 400 600; }
  :root {
    --ink: #04060C; --gold: #D6B788; --gold-lt: #EAD7B4; --text: #EFE8D8; --dim: #B6BBC8; --faint: #7E869A;
    --serif: "Instrument Serif", Georgia, serif; --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: var(--sans); color: var(--text);
    background:
      radial-gradient(52rem 30rem at 6% -14%, rgba(29, 59, 134, 0.62), transparent 62%),
      radial-gradient(36rem 26rem at 96% 30%, rgba(214, 183, 136, 0.14), transparent 62%),
      var(--ink); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(234, 215, 180, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(234, 215, 180, 0.07) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 26% 40%, #000 10%, transparent 72%); }
  .streams { position: absolute; inset: 0; }
  .frame { position: absolute; inset: 0; padding: 58px 70px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 14px; }
  .top img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(234, 215, 180, 0.3), 0 10px 26px rgba(0, 0, 0, 0.6); }
  .top span { font-family: var(--serif); font-size: 28px; }
  .top i { flex: 1; height: 1px; margin-left: 18px; background: linear-gradient(90deg, rgba(214, 183, 136, 0.5), transparent); }
  h1 { margin: 54px 0 0; font-family: var(--serif); font-weight: 400; font-size: 104px; line-height: 0.95; letter-spacing: -1px; }
  h1 em { font-style: italic; background: linear-gradient(100deg, #B8955F 0%, #F6E6C4 35%, #D6B788 60%, #F2DFB6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 26px 0 0; max-width: 640px; font-size: 25px; line-height: 1.42; color: var(--dim); }
  p b { color: var(--text); font-weight: 500; }
  .row { margin-top: auto; display: flex; align-items: center; gap: 30px; font-family: var(--mono); font-size: 17px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .row .live { display: inline-flex; align-items: center; gap: 12px; color: var(--gold-lt); }
  .row .dot { width: 11px; height: 11px; border-radius: 50%; background: #5BE38E; box-shadow: 0 0 14px rgba(91, 227, 142, 0.8); }
  .ed { position: absolute; right: 70px; top: 150px; width: 330px; padding: 22px 22px 18px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(17, 26, 52, 0.75), rgba(7, 11, 22, 0.9));
    box-shadow: inset 0 0 0 1px rgba(234, 215, 180, 0.2), 0 40px 90px -30px rgba(0, 0, 0, 0.9), 0 0 70px -20px rgba(214, 183, 136, 0.35);
    transform: perspective(1100px) rotateY(-12deg) rotateX(4deg); }
  .ed::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .ed .h { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .ed .t { margin: 14px 0 2px; font-family: var(--serif); font-size: 32px; line-height: 1.02; }
  .ed .s { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .ed .l { display: block; margin-top: 16px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .ed .b { display: block; height: 8px; margin-top: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(214, 183, 136, 0.85), rgba(246, 230, 196, 0.95)); }
  .ed .b.dim { background: rgba(234, 215, 180, 0.1); }
</style>

<div class="card">
  <div class="grid"></div>

  <svg class="streams" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#F2D9A6" stop-opacity="0"/>
        <stop offset="1" stop-color="#F2D9A6" stop-opacity="0.65"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round">
      <path d="M740,70 C800,120 860,190 900,250"/>
      <path d="M1170,90 C1120,150 1080,210 1010,260"/>
      <path d="M720,600 C790,540 860,470 920,420"/>
      <path d="M1180,600 C1120,540 1070,480 1010,430"/>
      <path d="M690,330 C760,320 820,320 880,330"/>
    </g>
    <g fill="#F6E6C4">
      <circle cx="899" cy="248" r="2.6"/><circle cx="1011" cy="259" r="2.4"/>
      <circle cx="919" cy="421" r="2.4"/><circle cx="1011" cy="431" r="2.6"/><circle cx="879" cy="330" r="2.2"/>
    </g>
  </svg>

  <div class="ed">
    <div class="h"><span>● Your edition</span><span>06:00 ET</span></div>
    <div class="t">The Morning Edition</div>
    <div class="s">built around your desk</div>
    <span class="l">What moved</span><span class="b" style="width:92%"></span><span class="b" style="width:64%"></span>
    <span class="l">Why it matters to your book</span><span class="b" style="width:86%"></span><span class="b dim" style="width:70%"></span>
    <span class="l">On your calendar</span><span class="b dim" style="width:74%"></span>
  </div>

  <div class="frame">
    <div class="top"><img src="../assets/favicon-64.png" alt="" /><span>Girnar Holdings</span><i></i></div>
    <h1>Your mandate,<br /><em>read overnight.</em></h1>
    <p>Research engines that read the market while you sleep — <b>six of them, live every day.</b></p>
    <div class="row"><span class="live"><i class="dot"></i>6 engines live</span><span>Running in public</span></div>
  </div>
</div>
